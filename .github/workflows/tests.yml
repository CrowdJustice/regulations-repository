name: Tests

on:
  push:
    paths: ["agent/**", "sources/**"]
  pull_request:
    paths: ["agent/**", "sources/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "agent/test/*.test.mjs"
