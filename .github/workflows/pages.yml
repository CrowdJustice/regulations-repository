name: Publish the pages

# Builds the public page and the admin page from what is on the main branch and puts them online with GitHub Pages.
# It runs after every daily check and every admin action, and whenever someone changes the main branch directly.

on:
  workflow_run:
    workflows: ["Daily check", "Admin action"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ["data/**", "sources/**", "web/**", "agent/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      on: ${{ steps.pages.outputs.on }}
    steps:
      - name: Is GitHub Pages switched on?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages is not switched on for this repository, so nothing was published. Switch it on under Settings, Pages, Source: GitHub Actions."
          fi

  publish:
    needs: check
    if: needs.check.outputs.on == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: node agent/build-page.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v5
        id: deploy
