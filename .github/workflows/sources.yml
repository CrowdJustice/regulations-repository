name: Check sources

# Reads every source that is switched on and reports what it found. No AI, so it needs no credential.

on:
  workflow_dispatch:
    inputs:
      save:
        description: "Also save a copy of the pages to this branch (for testing; not allowed on main)."
        type: boolean
        default: false
      since:
        description: "Look back to this date (YYYY-MM-DD). Leave empty for the default."
        required: false
      country:
        description: "Check one country only (uk or au). Leave empty for all."
        required: false
      pages:
        description: "Also read this many older listing pages per source, to preview the run of the past. Leave empty for one."
        required: false
      source:
        description: "Check this one source id, even if it is switched off. Leave empty for every source that is on."
        required: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read the sources
        env:
          SINCE: ${{ inputs.since }}
          COUNTRY: ${{ inputs.country }}
          PAGES: ${{ inputs.pages }}
          ONE_SOURCE: ${{ inputs.source }}
          SAVE: ${{ inputs.save }}
        run: |
          args=()
          if [ -n "$SINCE" ]; then args+=(--since "$SINCE"); fi
          if [ -n "$COUNTRY" ]; then args+=(--country "$COUNTRY"); fi
          if [ -n "$PAGES" ]; then args+=(--pages "$PAGES"); fi
          if [ -n "$ONE_SOURCE" ]; then args+=(--source "$ONE_SOURCE"); fi
          if [ "$SAVE" = "true" ]; then export TRACKER_RECORD=snapshot; fi
          node agent/check-sources.mjs "${args[@]}" | tee report.md || true
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save the pages to this branch
        if: inputs.save && github.ref_name != github.event.repository.default_branch
        run: |
          mkdir -p snapshot
          cp report.md snapshot/report.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot
          git commit -q -m "Save a copy of the source pages for testing"
          git push
